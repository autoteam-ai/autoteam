# ai-workflow 配置。aiwf 和 agent 都会读这个文件，受 CODEOWNERS 保护。
# 格式：每行 KEY=VALUE，# 开头是注释；不支持行尾注释和变量展开。

# GitHub 仓库（owner/name）和默认分支
AIWF_REPO={{AIWF_REPO}}
AIWF_DEFAULT_BRANCH={{AIWF_DEFAULT_BRANCH}}

# 人类负责人的 GitHub 用户名：写进 CODEOWNERS，规则文件只能由他批准修改
AIWF_OWNER={{AIWF_OWNER}}

# 机器账号的 GitHub 用户名，aiwf github --apply 会邀请为协作者；留空表示暂不配置
AIWF_IMPL_BOT=
AIWF_REVIEW_BOT=
AIWF_PLANNER_BOT=

# Multica 工作区 slug、项目标题
AIWF_MULTICA_WORKSPACE={{AIWF_MULTICA_WORKSPACE}}
AIWF_MULTICA_PROJECT={{AIWF_MULTICA_PROJECT}}
# 负责批准任务、接收升级的成员名（Multica 里的显示名）；留空表示运行 aiwf 的人
AIWF_HUMAN={{AIWF_HUMAN}}
# agent 的调用权限：private（只有创建者能触发）或 workspace（工作区成员都能触发）
AIWF_AGENT_ACCESS=private
# 任务编号前缀（Multica 工作区的 issue prefix）
AIWF_ISSUE_PREFIX={{AIWF_ISSUE_PREFIX}}

# 必需检查的名字，要和 gate.yml 里的 job 名一致
AIWF_CHECK_NAME=check
# 单个 PR 的改动行数上限（gate.yml 在运行时读取）
AIWF_PR_MAX_LINES=400

# 防止来回打转：同一个 PR 的打回上限、同一个任务的验收不通过上限，到了就升级给人
AIWF_MAX_REVIEW_REJECTIONS=2
AIWF_MAX_ACCEPTANCE_FAILURES=2

# 部署用的 GitHub environment；GitHub Free 的私有仓库不支持，留空
AIWF_DEPLOY_ENVIRONMENT={{AIWF_DEPLOY_ENVIRONMENT}}

# autopilot 定时触发的时区
AIWF_TIMEZONE={{AIWF_TIMEZONE}}
