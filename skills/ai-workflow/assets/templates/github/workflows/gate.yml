# 合并闸门：规则集把 check 设为必需检查。受 CODEOWNERS 保护，只能由人批准修改。
name: gate

on:
  pull_request:
  merge_group:            # 启用合并队列必须加

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 在这里加上 make check 需要的运行时，例如：
      # - uses: actions/setup-node@v7
      #   with:
      #     node-version: 22

      # PR 改动行数上限在 ops/agents/aiwf.conf 的 AIWF_PR_MAX_LINES（默认 400，参考 AI PR 的 75 分位 408 行）。
      # lock 文件不计；规则文件（.github/、ops/agents/）受 CODEOWNERS 保护、由人批准，也不计
      - name: pr-size
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          max=$(sed -n 's/^AIWF_PR_MAX_LINES=//p' ops/agents/aiwf.conf | tr -d '[:space:]')
          max=${max:-400}
          changed=$(git diff --numstat "origin/$BASE"...HEAD -- . \
            ':(exclude,glob)**/*.lock' ':(exclude,glob)**/package-lock.json' \
            ':(exclude,glob)**/pnpm-lock.yaml' ':(exclude,glob)**/go.sum' \
            ':(exclude,glob).github/**' ':(exclude,glob)ops/agents/**' \
            | awk '{s += $1 + $2} END {print s + 0}')
          echo "本 PR 改动 $changed 行，上限 $max 行"
          if [ "$changed" -gt "$max" ]; then
            echo "::error::PR 改动 $changed 行，超过上限 $max 行：拆成更小的任务"
            exit 1
          fi

      # 重复代码占比上限在 .jscpd.json 的 threshold：老项目按现状定值，只降不升
      - name: duplication
        run: npx --yes jscpd@5 --config .jscpd.json .

      - name: check
        run: make check
