name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 和 Makefile 里的 docker 镜像保持同一个版本，避免本地和 CI 的检查结果不一致
      - name: install linters
        env:
          SHELLCHECK_VERSION: v0.11.0
          ACTIONLINT_VERSION: 1.7.12
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP" --strip-components=1 "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION" "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: check
        run: |
          shellcheck --version | sed -n 2p
          make check
