# 合并闸门：规则集把 check 设为必需检查。受 CODEOWNERS 保护，只能由人批准修改。
name: gate

on:
  pull_request:
  merge_group:            # 启用合并队列必须加

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 上限和不计入的路径都在 .autoteam/autoteam.conf：AUTOTEAM_PR_MAX_LINES（默认 400，
      # 参考 AI PR 的 75 分位 408 行）、AUTOTEAM_PR_SIZE_EXCLUDE（lock 文件，以及受
      # CODEOWNERS 保护、由人批准的规则文件——它们不该占 agent 的代码行数预算）
      - name: pr-size
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          conf=.autoteam/autoteam.conf
          max=$(sed -n 's/^AUTOTEAM_PR_MAX_LINES=//p' "$conf" | head -n 1 | tr -d '[:space:]')
          max=${max:-400}
          skip=$(sed -n 's/^AUTOTEAM_PR_SIZE_EXCLUDE=//p' "$conf" | head -n 1 | tr -d '[:space:]')
          skip=${skip:-'**/*.lock,**/*.md,.github/**,.autoteam/**'}
          # set -f 关掉路径展开：不关的话 $skip 里的 **/*.md 会先被 shell 展开成
          # 实际文件名（而且没开 globstar 时 ** 等于 *，只匹配一层），排除就不准了
          set -f --
          IFS=,
          for pat in $skip; do set -- "$@" ":(exclude,glob)$pat"; done
          unset IFS
          set +f
          changed=$(git diff --numstat "origin/$BASE"...HEAD -- . "$@" \
            | awk '{s += $1 + $2} END {print s + 0}')
          echo "本 PR 改动 $changed 行，上限 $max 行"
          if [ "$changed" -gt "$max" ]; then
            echo "::error::PR 改动 $changed 行，超过上限 $max 行：拆成更小的任务"
            exit 1
          fi

      # 本仓库特有：make check（shellcheck、actionlint、重复代码、单元测试）进开发镜像
      # dev/Dockerfile 执行，工具版本只写在 Dockerfile 里，本地和 CI 用的是同一套
      - name: development image tag
        id: dev-image
        run: echo "tag=$(bash scripts/in-container.sh --tag)" >> "$GITHUB_OUTPUT"

      - name: set up buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        continue-on-error: true

      - name: build development image
        if: steps.buildx.outcome == 'success'
        uses: docker/build-push-action@v6
        continue-on-error: true # make check falls back to the local docker build
        with:
          context: ./dev
          load: true
          tags: ${{ steps.dev-image.outputs.tag }}
          cache-from: type=gha,scope=autoteam-dev
          cache-to: type=gha,scope=autoteam-dev,mode=max

      - name: check
        run: make check
