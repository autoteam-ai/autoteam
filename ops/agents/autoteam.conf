# autoteam 配置。autoteam 和 agent 都会读这个文件，受 CODEOWNERS 保护。
# 格式：每行 KEY=VALUE，# 开头是注释；不支持行尾注释和变量展开。

# GitHub 仓库（owner/name）和默认分支
AUTOTEAM_REPO=autoteam-ai/autoteam
AUTOTEAM_DEFAULT_BRANCH=main

# 人类负责人的 GitHub 用户名：写进 CODEOWNERS，规则文件只能由他批准修改
AUTOTEAM_OWNER=songhuangcn

# 三个 GitHub App 的 App ID。Implementer 和 Reviewer 必须是不同的 App：GitHub 不允许
# PR 作者批准自己的 PR，两个不同身份才能让"写代码的不能评审自己"由平台保证。
# App 由人创建和安装（autoteam 只核对，不能代建），私钥放 ops/agents/local/。
AUTOTEAM_IMPLEMENTER_APP_ID=5011663
AUTOTEAM_REVIEWER_APP_ID=5011589
AUTOTEAM_PLANNER_APP_ID=5011610

# App 私钥的机器级目录（~ 按运行的那台机器展开）。查找顺序：
# AUTOTEAM_<角色>_APP_KEY 指的路径 > 仓库的 ops/agents/local/ > 这里。
# agent 每接一个任务都可能重新 checkout 一份仓库，私钥只放仓库里不会跟过去
AUTOTEAM_KEYS_DIR=~/.keys

# Multica 工作区 slug、项目标题
AUTOTEAM_MULTICA_WORKSPACE=hdgcs
AUTOTEAM_MULTICA_PROJECT=autoteam
# 负责批准任务、接收升级的成员名（Multica 里的显示名）；留空表示运行 autoteam 的人
AUTOTEAM_HUMAN=Song
# agent 的调用权限：private（只有创建者能触发）或 workspace（工作区成员都能触发）
AUTOTEAM_AGENT_ACCESS=private
# 任务编号前缀（Multica 工作区的 issue prefix）
AUTOTEAM_ISSUE_PREFIX=MUL

# 必需检查的名字，要和 gate.yml 里的 job 名一致
AUTOTEAM_CHECK_NAME=check
# 单个 PR 的改动行数上限（gate.yml 在运行时读取）
AUTOTEAM_PR_MAX_LINES=400

# 不计入 PR 行数上限的路径（逗号分隔，git pathspec 的 glob）。上限管的是代码改动量，
# 文档和由人批准的规则文件不该占 agent 的预算
AUTOTEAM_PR_SIZE_EXCLUDE=**/*.lock,**/package-lock.json,**/pnpm-lock.yaml,**/go.sum,**/*.md,.github/**,ops/agents/**,skills/autoteam/assets/templates/**

# autoteam diff --check 要跳过的文件（逗号分隔）：按本项目需要改过、不打算跟模板保持一致的
# playbook 保存本仓库的参数调整记录，重新渲染时保留。
AUTOTEAM_DIFF_IGNORE=.github/workflows/gate.yml,.github/workflows/deploy.yml,.github/workflows/rollback.yml,ops/agents/playbook.md

# 防止来回打转：同一个 PR 的打回上限、同一个任务的验收不通过上限，到了就升级给人
AUTOTEAM_MAX_REVIEW_REJECTIONS=2
AUTOTEAM_MAX_ACCEPTANCE_FAILURES=2

# 部署用的 GitHub environment；GitHub Free 的私有仓库不支持，留空
AUTOTEAM_DEPLOY_ENVIRONMENT=production

# autopilot 定时触发的时区
AUTOTEAM_TIMEZONE=Asia/Shanghai

# ---- 试行期定时频率（2026-09-21 起）----
# 团队刚开始自己跑，先按优先级降频：省 token，也避免人在短时间里堆积太多要看的报告。
# 不写这些键时用 autoteam 的默认值（见 docs/reference/config.md）。
# 退出试行期的依据：连续 4 周 health-metrics.sh 的 human_7d 不上升、且没有因为降频漏掉的问题。
# 到那时由 Planner 提任务改回默认值，人批准——这是「规则复盘」autopilot 要盯的事之一。

# 流转心跳。试行期从每 2 小时 → 每 4 小时，再放宽到每 5 小时，
# 对齐 Claude 5 小时额度窗口：4 小时一次容易叠加巡检和派发任务，导致额度不足。
# 小时字段 */5 取 0、5、10、15、20 点，20 点到次日 0 点仍只有 4 小时；
# 24 不能被 5 整除，标准 cron 无法表达严格的「每 5 小时」。
AUTOTEAM_CRON_PATROL=0 */5 * * *
# 人了解全局的唯一窗口，试行期人工介入多，不降
AUTOTEAM_CRON_DAILY_DIGEST=0 9 * * *
# 把人工介入变成规则的地方，试行期最该保留，不降
AUTOTEAM_CRON_RULE_REVIEW=0 12 * * 1
# 审计和方向类：每周 → 每月，分散到不同日子，人一天只看一份
AUTOTEAM_CRON_SCORECARD=0 8 1 * *
AUTOTEAM_CRON_ROADMAP=0 10 8 * *
AUTOTEAM_CRON_SPEC_RECONCILE=0 9 15 * *
AUTOTEAM_CRON_CONSOLIDATION=0 9 22 * *
AUTOTEAM_CRON_FRONTIER=0 11 25 * *
# 每月 → 每季度
AUTOTEAM_CRON_LEGACY_SWEEP=0 3 28 1,4,7,10 *
